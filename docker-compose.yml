services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban_local_password
      POSTGRES_DB: kanban_db
    ports:
      - "5433:5432"
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data

volumes:
  kanban_pgdata: